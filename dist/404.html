<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090b09">
  <title>페이지를 찾을 수 없습니다 | 조우 프로덕션</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px;background:#090b09;color:#eeefe8;font-family:'Courier New','Malgun Gothic',monospace}
    main{width:min(520px,100%)}
    .brand{font:900 33px/1 Arial,'Malgun Gothic',sans-serif;letter-spacing:-3px;color:inherit;text-decoration:none}
    .brand span{font:700 17px 'Noto Serif KR','Batang',serif;letter-spacing:1px;color:#8e9589;margin-left:9px}
    .code{font-size:10px;letter-spacing:1.4px;color:#d9fa72;margin:56px 0 18px}
    h1{font:500 32px/1.35 Arial,'Malgun Gothic',sans-serif;letter-spacing:-1.5px;margin:0 0 14px;word-break:keep-all}
    p{font:13px/1.9 Arial,'Malgun Gothic',sans-serif;color:#8e9589;margin:0 0 36px;word-break:keep-all}
    .go{display:inline-flex;align-items:center;gap:18px;min-height:52px;padding:0 20px;border:1px solid #d9fa72;color:#d9fa72;text-decoration:none;font-size:13px;letter-spacing:.6px}
    .go:hover{background:#d9fa72;color:#090b09}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="조우 프로덕션 홈">조우<span lang="zh-Hant">遭遇</span></a>
    <div class="code">404 / NO SIGNAL</div>
    <h1>찾으시는 장면이 여기에는 없습니다.</h1>
    <p>주소가 바뀌었거나 잘못 입력된 것 같습니다. 첫 화면에서 작품을 다시 만나보세요.</p>
    <a class="go" href="/">첫 화면으로 <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
